name: tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install triton numpy pytest onnx onnxscript onnxruntime
      - name: Tests (Triton kernels run in the interpreter)
        env:
          TRITON_INTERPRET: "1"
        run: pytest -q
